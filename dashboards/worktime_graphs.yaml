type: vertical-stack
cards:
  # Daily bars use the recorder's maximum value for each calendar day so
  # today's live sensor is represented by the highest value reached so far.
  - type: custom:mini-graph-card
    name: Hours worked per day
    entities:
      - entity: sensor.today_hours_today
        name: Worked
    hours_to_show: 168
    group_by:
      duration: 1d
      func: max
    aggregate_func: max
    graph: bar
    show:
      labels: true
      legend: false
      points: false
      fill: false

  # Each period sensor remains stored in Home Assistant's recorder. These
  # graphs show the daily snapshots of the corresponding rolling total.
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mini-graph-card
        name: Today
        entities: [sensor.today_hours_today]
        hours_to_show: 24
        group_by: {duration: 1h, func: max}
        graph: bar
        show: {labels: true, legend: false, points: false}
      - type: custom:mini-graph-card
        name: Yesterday
        entities: [sensor.today_hours_yesterday]
        hours_to_show: 24
        group_by: {duration: 1h, func: max}
        graph: bar
        show: {labels: true, legend: false, points: false}
      - type: custom:mini-graph-card
        name: This week
        entities: [sensor.this_week_hours_this_week]
        hours_to_show: 168
        group_by: {duration: 1d, func: max}
        graph: bar
        show: {labels: true, legend: false, points: false}
      - type: custom:mini-graph-card
        name: This month
        entities: [sensor.this_month_hours_this_month]
        hours_to_show: 720
        group_by: {duration: 1d, func: max}
        graph: bar
        show: {labels: true, legend: false, points: false}
      - type: custom:mini-graph-card
        name: Last month
        entities: [sensor.last_month_hours_last_month]
        hours_to_show: 720
        group_by: {duration: 1d, func: max}
        graph: bar
        show: {labels: true, legend: false, points: false}
      - type: custom:mini-graph-card
        name: This year
        entities: [sensor.this_year_hours_this_year]
        hours_to_show: 8760
        group_by: {duration: 30d, func: max}
        graph: bar
        show: {labels: true, legend: false, points: false}
